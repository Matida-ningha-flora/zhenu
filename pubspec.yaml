name: zhendu_app
description: NeuroSigne - traduction et apprentissage de la LSF
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  shared_preferences: ^2.2.2
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  camera: ^0.12.0+2
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.4.0
  crypto: ^3.0.7
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/branding/
    - assets/lsf/
    - assets/google_fonts/
